<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post – Craig Simpson / TriCloud Tech</title>
  <link rel="icon" type="image/svg+xml" href="docs/assets/pics/favicon.svg">
  <link rel="icon" type="image/x-icon" href="https://tricloud.tech/docs/assets/pics/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #002b36;
      --panel: rgba(7, 54, 66, 0.88);
      --panel-strong: rgba(7, 54, 66, 0.94);
      --text: #fdf6e3;
      --muted: #93a1a1;
      --accent: #2aa198;
      --accent-2: #268bd2;
      --stroke: rgba(147, 161, 161, 0.25);
    }

    body {
      font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 18% 18%, rgba(42, 161, 152, 0.16), transparent 32%),
                  radial-gradient(circle at 82% 6%, rgba(38, 139, 210, 0.16), transparent 28%),
                  linear-gradient(145deg, #002129 0%, #002b36 55%, #073642 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 3rem 1.5rem 2.5rem;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 42vw;
      height: 42vw;
      background: radial-gradient(circle, rgba(42, 161, 152, 0.24) 0%, rgba(0, 43, 54, 0) 55%);
      filter: blur(60px);
      z-index: 0;
    }

    body::before { top: -12vw; left: -10vw; }
    body::after  { bottom: -14vw; right: -6vw; background: radial-gradient(circle, rgba(38, 139, 210, 0.24) 0%, rgba(0, 43, 54, 0) 55%); }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.65rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--stroke);
      background: var(--panel-strong);
      transition: transform 0.18s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .blog-date {
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.6rem;
    }

    .post-cover {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 2rem;
      border: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    /* Prose styles for rendered markdown */
    .prose { color: var(--muted); }
    .prose h1, .prose h2, .prose h3, .prose h4 { color: #eee8d5; line-height: 1.3; }
    .prose h1 { font-size: clamp(1.8rem, 3vw, 2.4rem); margin: 0 0 1.4rem; }
    .prose h2 { font-size: 1.45rem; margin: 2rem 0 0.6rem; }
    .prose h3 { font-size: 1.2rem;  margin: 1.6rem 0 0.5rem; }
    .prose h4 { font-size: 1.05rem; margin: 1.4rem 0 0.4rem; }
    .prose p  { font-size: 1.05rem; line-height: 1.8; margin-bottom: 1.2em; }
    .prose a  { color: var(--accent-2); text-decoration: none; }
    .prose a:hover { text-decoration: underline; }
    .prose strong { color: #fdf6e3; }
    .prose em { font-style: italic; }
    .prose ul, .prose ol { padding-left: 1.5em; margin-bottom: 1.2em; }
    .prose li { line-height: 1.7; margin-bottom: 0.3em; }
    .prose blockquote {
      border-left: 3px solid var(--accent);
      margin: 0 0 1.2em;
      padding: 0.5em 0 0.5em 1.2em;
    }
    .prose code {
      background: rgba(0, 33, 41, 0.8);
      border: 1px solid var(--stroke);
      padding: 0.15em 0.45em;
      border-radius: 5px;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.88em;
      color: var(--accent);
    }
    .prose pre {
      background: rgba(0, 33, 41, 0.8);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      overflow-x: auto;
      margin-bottom: 1.4em;
    }
    .prose pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.9em;
      color: var(--text);
    }
    .prose img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 1em 0;
      border: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      object-fit: unset;
    }
    .prose hr {
      border: none;
      border-top: 1px solid var(--stroke);
      margin: 2rem 0;
    }
    .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.2em; font-size: 0.95rem; }
    .prose th, .prose td { padding: 0.5rem 0.75rem; border: 1px solid var(--stroke); text-align: left; }
    .prose th { background: var(--panel-strong); color: #eee8d5; }
    .prose .mermaid { margin: 1.6em 0; text-align: center; }
    .prose .mermaid svg { max-width: 100%; height: auto; border-radius: 12px; }

    .footer {
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
      <a href="index.html">
        <img src="docs/assets/pics/tricloud_logo.png" alt="TriCloud Tech" style="height:40px;width:auto;border-radius:0;border:none;box-shadow:none;" />
      </a>
      <a class="btn" href="blog.html">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> All posts
      </a>
    </header>

    <article class="card">
      <div id="post-content">
        <p style="color:var(--muted)">Loading…</p>
      </div>
    </article>

    <div class="footer">
      &copy; 2026 Craig Simpson - Tricloud Tech<br>
      <small>Company Number 16903834</small>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        background: '#002129',
        primaryColor: '#073642',
        primaryTextColor: '#fdf6e3',
        primaryBorderColor: 'rgba(147,161,161,0.25)',
        lineColor: '#2aa198',
        secondaryColor: '#073642',
        tertiaryColor: '#002b36',
        edgeLabelBackground: '#073642',
        fontFamily: 'Space Grotesk, Inter, system-ui, sans-serif',
      }
    });
  </script>
  <script src="js/blog.js"></script>
  <script>
    (async () => {
      const container = document.getElementById('post-content');
      const params    = new URLSearchParams(location.search);
      const file      = params.get('file');

      if (!file) {
        container.innerHTML = `<p style="color:var(--muted)">No post specified. <a href="blog.html" style="color:var(--accent-2)">View all posts.</a></p>`;
        return;
      }

      try {
        const raw        = await Blog.fetchPostContent(file);
        const { meta, body } = Blog.parseFrontmatter(raw);

        if (meta.title) document.title = `${meta.title} – Craig Simpson`;

        const cover = meta.image
          ? `<img src="${meta.image}" alt="" class="post-cover" />`
          : '';
        const date = meta.date
          ? `<span class="blog-date">${Blog.formatDate(meta.date)}</span>`
          : '';

        container.innerHTML = `
          ${cover}
          <div class="prose">
            ${date}
            <h1>${meta.title || ''}</h1>
            ${marked.parse(body)}
          </div>`;

        container.querySelectorAll('pre code.language-mermaid').forEach(block => {
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = block.textContent;
          block.parentElement.replaceWith(div);
        });
        await mermaid.run({ nodes: container.querySelectorAll('.mermaid') });
      } catch {
        container.innerHTML = `<p style="color:var(--muted)">Could not load this post. <a href="blog.html" style="color:var(--accent-2)">Back to blog.</a></p>`;
      }
    })();
  </script>
</body>
</html>
