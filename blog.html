<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog – Craig Simpson / TriCloud Tech</title>
  <link rel="icon" type="image/svg+xml" href="docs/assets/pics/favicon.svg">
  <link rel="icon" type="image/x-icon" href="https://tricloud.tech/docs/assets/pics/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #002b36;
      --panel: rgba(7, 54, 66, 0.88);
      --panel-strong: rgba(7, 54, 66, 0.94);
      --text: #fdf6e3;
      --muted: #93a1a1;
      --accent: #2aa198;
      --accent-2: #268bd2;
      --stroke: rgba(147, 161, 161, 0.25);
    }

    body {
      font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 18% 18%, rgba(42, 161, 152, 0.16), transparent 32%),
                  radial-gradient(circle at 82% 6%, rgba(38, 139, 210, 0.16), transparent 28%),
                  linear-gradient(145deg, #002129 0%, #002b36 55%, #073642 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 3rem 1.5rem 2.5rem;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 42vw;
      height: 42vw;
      background: radial-gradient(circle, rgba(42, 161, 152, 0.24) 0%, rgba(0, 43, 54, 0) 55%);
      filter: blur(60px);
      z-index: 0;
    }

    body::before { top: -12vw; left: -10vw; }
    body::after  { bottom: -14vw; right: -6vw; background: radial-gradient(circle, rgba(38, 139, 210, 0.24) 0%, rgba(0, 43, 54, 0) 55%); }

    main {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .panel {
      background: var(--panel-strong);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      height: 100%;
    }

    h2 { font-size: 1.4rem; }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.6rem;
      flex-wrap: wrap;
    }

    .section-eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--stroke);
      border-radius: 999px;
      background: var(--panel-strong);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.75rem 1.15rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.98rem;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--stroke);
      transition: transform 0.18s ease, background 0.25s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn.ghost { background: var(--panel-strong); }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .blog-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, border-color 0.25s ease;
      overflow: hidden;
      padding: 0;
    }

    .blog-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .blog-thumb {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 14px 14px 0 0;
      border: none;
      box-shadow: none;
    }

    .blog-card-body {
      padding: 1.1rem 1.2rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }

    .blog-date {
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .blog-title {
      font-size: 1.08rem;
      color: #eee8d5;
      line-height: 1.35;
      margin-bottom: 0;
    }

    .blog-excerpt {
      font-size: 0.93rem;
      line-height: 1.6;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .blog-read-more {
      margin-top: auto;
      padding-top: 0.7rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-2);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .blog-loading {
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .footer {
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      body { padding-top: 2.5rem; }
      main { gap: 1.2rem; }
    }

    @media (max-width: 520px) {
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
      <div>
        <a href="index.html">
          <img src="docs/assets/pics/tricloud_logo.png" alt="TriCloud Tech" style="height:40px;width:auto;border-radius:0;border:none;box-shadow:none;" />
        </a>
      </div>
      <a class="btn ghost" href="index.html">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to site
      </a>
    </header>

    <section class="card">
      <div class="section-header">
        <span class="section-eyebrow">Blog</span>
        <h2>All Posts</h2>
      </div>
      <div class="blog-grid" id="blog-posts">
        <p class="blog-loading">Loading posts…</p>
      </div>
    </section>

    <div class="footer">
      &copy; 2026 Craig Simpson - Tricloud Tech<br>
      <small>Company Number 16903834</small>
    </div>
  </main>

  <script src="js/blog.js"></script>
  <script>
    (async () => {
      const container = document.getElementById('blog-posts');
      try {
        const files = await Blog.fetchPostList();
        if (!files.length) {
          container.innerHTML = '<p style="color:var(--muted)">No posts yet — check back soon.</p>';
          return;
        }
        const posts = await Promise.all(
          files.map(async f => {
            const raw     = await Blog.fetchPostContent(f.name);
            const { meta } = Blog.parseFrontmatter(raw);
            return { meta, filename: f.name };
          })
        );
        container.innerHTML = posts.map(Blog.postCard).join('');
      } catch {
        Blog.renderError(container);
      }
    })();
  </script>
</body>
</html>
